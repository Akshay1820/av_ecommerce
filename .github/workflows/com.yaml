name: Ecommerce Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ORDER_ARTIFACT_NAME: order-service-jar
  USER_ARTIFACT_NAME: user-service-jar
  PRODUCT_ARTIFACT_NAME: product-service-jar

  ORDER_DOCKER_IMAGE: order-service
  USER_DOCKER_IMAGE: user-service
  PRODUCT_DOCKER_IMAGE: product-service

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order
          - product
          - user

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-service-jar
          path: ${{ matrix.service }}/target/*.jar

  docker:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order
          - product
          - user

    steps:
      - name: Checking our source code to get the dockerfile
        uses: actions/checkout@v4

      - name: Download artifact for all services
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-service-jar
          path: ${{ matrix.service }}/target/

      - name: Building docker image for all service
        working-directory: ${{ matrix.service }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}-service:${{ github.sha }} .
          docker images

      - name: Docker Login
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pushing image to docker hub
        if: ${{ github.event_name == 'push' }}
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}-service:${{ github.sha }}

  deploy:
    needs: docker
    if: ${{ github.event_name == 'push' }}

    runs-on: ubuntu-latest

    steps:
      - name: Login to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "Login to the VPS"
            docker pull akshayvaidya18/user-service:2e350fe33affdf95ae44aa7aba8991564fb29aa7
