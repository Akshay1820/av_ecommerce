name: Ecommerce Pipeline

on:
  pull_request:

env:
  ORDER_ARTIFACT_NAME: order-service-jar
  USER_ARTIFACT_NAME: user-service-jar
  PRODUCT_ARTIFACT_NAME: product-service-jar

  ORDER_DOCKER_IMAGE: order-service
  USER_DOCKER_IMAGE: user-service
  PRODUCT_DOCKER_IMAGE: product-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Order Service
        working-directory: order
        run: mvn clean package -DskipTests

      - name: Uploading order service jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ORDER_ARTIFACT_NAME }}
          path: order/target/*.jar

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Product Service
        working-directory: product
        run: mvn clean package -DskipTests

      - name: Uploading product service jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_ARTIFACT_NAME }}
          path: product/target/*.jar

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build User Service
        working-directory: user
        run: mvn clean package -DskipTests

      - name: Uploading user service jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.USER_ARTIFACT_NAME }}
          path: user/target/*.jar

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checking our source code to get the dockerfile
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORDER_ARTIFACT_NAME }}
          path: order/target/

      - name: Building docker image for order service
        working-directory: order
        run: |
          docker build -t ${{ env.ORDER_DOCKER_IMAGE }} .

      - name: Download artifact for User
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.USER_ARTIFACT_NAME }}
          path: user/target/

      - name: Building docker image for user service
        working-directory: user
        run: |
          docker build -t ${{ env.USER_DOCKER_IMAGE }} .

      - name: Download artifact for Product
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRODUCT_ARTIFACT_NAME }}
          path: product/target/

      - name: Building docker image for product service
        working-directory: product
        run: |
          docker build -t ${{ env.PRODUCT_DOCKER_IMAGE }} .
          docker images
